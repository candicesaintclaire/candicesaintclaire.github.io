<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candice Saint Claire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Courier New", Courier, monospace;
            background: #fafafa;
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            line-height: 1.6;
        }
        
        main {
            max-width: 500px;
            text-align: center;
        }
        
        h1 {
            font-size: 1.5rem;
            font-weight: normal;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }
        
        p {
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
        }
        
        a {
            color: #222;
            text-decoration: underline;
            text-underline-offset: 0.2em;
        }
        
        a:hover {
            background: #222;
            color: #fafafa;
        }
        
        .divider {
            margin: 1.5rem 0;
            border: none;
            border-top: 1px solid #ccc;
        }
        
        .contact {
            font-size: 0.85rem;
        }
        
        footer {
            position: fixed;
            bottom: 1rem;
            font-size: 0.75rem;
            color: #888;
        }
    </style>
</head>
<body>
    <main>
        <h1>Candice Saint Claire</h1>
        <p>Olympia, WA</p>
        
        <hr class="divider">
        
        <p class="contact">
            <a href="mailto:cstcl@pm.me">cstcl@pm.me</a><br>
            <a href="https://github.com/candicesaintclaire">github.com/candicesaintclaire</a>
        </p>
    </main>
    
    <footer>Last updated: February 2026</footer>
</body>
</html>
